version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chatpilot-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=file:/app/data/prod.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-gemini}
    volumes:
      # Persist SQLite database
      - chatpilot_db:/app/data
      # Persist uploaded files (PDFs, images)
      - chatpilot_uploads:/app/uploads
      # Persist WhatsApp sessions (keeps QR scan alive between restarts)
      - chatpilot_sessions:/app/data/sessions
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Pass your backend URL so Socket.IO connects correctly in production
        - VITE_API_URL=${VITE_API_URL}
    container_name: chatpilot-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  chatpilot_db:
  chatpilot_uploads:
  chatpilot_sessions:
